<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeXL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .container { text-align: center; }
        h1 { font-size: 3rem; color: #00ff00; margin-bottom: 0.5rem; }
        p { color: #888; font-size: 1.1rem; margin-bottom: 2rem; }
        a {
            display: inline-block;
            color: #00ff00;
            text-decoration: none;
            border: 1px solid #00ff00;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            margin: 0.5rem;
            transition: background 0.2s;
        }
        a:hover { background: #1a3a1a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TimeXL</h1>
        <p>Giant-digit stopwatch, timer, and clock for Android.</p>
        <a href="privacy.html">Privacy Policy</a>
        <a href="https://github.com/FaridBerlin/FaridBerlin.github.io/issues" target="_blank">Support</a>
    </div>
</body>
</html>
